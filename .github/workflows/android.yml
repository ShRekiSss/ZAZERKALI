name: Android APK

# Авто-сборка APK в облаке: каждый пуш в main собирает установочный файл.
# Скачать: вкладка Actions → последний прогон → Artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-android:
    name: Сборка debug-APK
    runs-on: ubuntu-22.04
    container: barichello/godot-ci:4.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      # Godot для подписи APK требует JDK 17; в образе его нет/не прописан.
      - name: Java SDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Godot читает путь к Java из своих настроек редактора, а не из $JAVA_HOME.
      - name: Прописать Java SDK в настройках Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          printf 'config_version=5\n\n[export]\n\nandroid/java_sdk_path="%s"\n' "$JAVA_HOME" \
            > "$HOME/.config/godot/editor_settings-4.tres"
          echo "--- editor_settings-4.tres ---"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      # В образе barichello/godot-ci нет Android-шаблонов экспорта — качаем с релиза.
      - name: Android export templates (4.6)
        run: |
          apt-get update -qq && apt-get install -y -qq unzip curl >/dev/null
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          curl -sL -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          ls -la /tmp/templates.tpz
          unzip -o /tmp/templates.tpz "templates/android_debug.apk" "templates/android_release.apk" -d /tmp
          mv /tmp/templates/android_debug.apk /tmp/templates/android_release.apk \
            "$HOME/.local/share/godot/export_templates/4.6.stable/"
          ls -la "$HOME/.local/share/godot/export_templates/4.6.stable"

      - name: Debug keystore
        run: |
          mkdir -p .android
          keytool -genkeypair -keystore .android/debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Export APK
        run: |
          mkdir -p builds
          godot --headless --export-debug "Android" builds/zazerkali-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zazerkali-apk
          path: builds/zazerkali-debug.apk
